# Example loader entry for dsh-compaction-rolling.
#
# PUBLISHED / INSTALLED (npm / dsh plugin add): package name
- id: compaction-rolling
  name: 'dsh-compaction-rolling'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    auto: true
    rollingMerge: true

# LOCAL DEV (no publish): point `name` at the TypeScript entry.
# DSH's loader can run .ts via tsx. Also disable compaction-basic in
# ~/.dsh/cordis.patch.yml (see cordis.patch.yml in this package).
