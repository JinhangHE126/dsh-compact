# Auto-applied by DSH on plugin install.
#
# This plugin registers the SAME ctx.compaction service as the built-in
# dsh-compaction-basic. Disable basic first, or DSH crashes at boot with
# "service already provided".
- id: compaction-basic
  disabled: true
- insert:
  - id: compaction-rolling
    name: 'dsh-compaction-rolling'
    config:
      thresholdRatio: 0.8
      retainRatio: 0.16
      maxTokens: 8192
      auto: true
      # Phase 1: summarize() still delegates to basic.
      # Phase 2 will enable rolling-merge prompt behaviour.
      rollingMerge: true
